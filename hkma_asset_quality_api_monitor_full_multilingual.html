<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HKMA Asset Quality Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root { --navy:#10213d; --blue:#1565c0; --teal:#00897b; --orange:#ef8d22; --red:#d9414f; --purple:#8e44ad; --grey:#667085; --bg:#f4f7fb; --card:#fff; --ink:#172033; --muted:#65738a; --line:#dce3ee; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans SC","Microsoft YaHei",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
    header { position:relative; padding:28px max(20px,calc((100vw - 1420px)/2)); background:var(--navy); color:#fff; }
    h1 { font-size:clamp(1.45rem,3vw,2.15rem); margin:0 210px 8px 0; }
    header p { margin:0; max-width:1050px; color:#cbd8ed; line-height:1.55; }
    .language-switcher { position:absolute; top:24px; right:max(20px,calc((100vw - 1420px)/2)); display:flex; border:1px solid rgba(255,255,255,.35); border-radius:9px; overflow:hidden; background:rgba(255,255,255,.08); }
    .language-switcher button { appearance:none; border:0; border-right:1px solid rgba(255,255,255,.25); border-radius:0; background:transparent; color:#dbe7fb; padding:8px 10px; font-size:.82rem; font-weight:700; cursor:pointer; }
    .language-switcher button:last-child { border-right:0; }.language-switcher button.active { background:#fff; color:var(--navy); }.language-switcher button:hover:not(.active) { background:rgba(255,255,255,.12); }
    main { max-width:1420px; margin:auto; padding:22px 20px 46px; }.controls,.card { background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 3px 14px rgba(15,32,61,.045); }.controls { padding:16px; display:flex; gap:14px; align-items:end; flex-wrap:wrap; margin-bottom:18px; }
    label { display:grid; gap:6px; text-transform:uppercase; color:var(--muted); font-weight:750; letter-spacing:.04em; font-size:.74rem; }select,button { font:inherit; border-radius:8px; padding:10px 12px; border:1px solid #cbd5e1; background:#fff; color:var(--ink); }select { min-width:270px; }#refresh { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:750; cursor:pointer; }#refresh:hover { filter:brightness(.94); }#status { margin-left:auto; align-self:center; color:var(--muted); font-size:.87rem; }
    .error { display:none; margin:0 0 18px; background:#fff1f2; color:#9f1239; border:1px solid #fecdd3; padding:13px 15px; border-radius:10px; font-size:.9rem; line-height:1.45; }.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin-bottom:18px; }.kpi { padding:17px; min-height:127px; }.name { font-size:.8rem; color:var(--muted); font-weight:750; min-height:36px; }.value { font-weight:850; font-size:1.72rem; letter-spacing:-.03em; margin:9px 0 4px; }.change { font-size:.85rem; color:var(--muted); }.good { color:var(--teal); }.bad { color:var(--red); }
    .grid { display:grid; grid-template-columns:2fr 1fr; gap:18px; }.card { padding:18px; }.card h2 { font-size:1.08rem; margin:0 0 4px; }.sub { font-size:.85rem; color:var(--muted); margin:0 0 14px; }.chart { height:350px; position:relative; }.table-wrap { overflow:auto; max-height:440px; }table { border-collapse:collapse; width:100%; font-size:.87rem; }th,td { padding:10px 8px; border-bottom:1px solid var(--line); white-space:nowrap; text-align:right; }th { position:sticky; top:0; background:#fff; color:var(--muted); font-size:.74rem; text-transform:uppercase; letter-spacing:.04em; z-index:1; }th:first-child,td:first-child { text-align:left; }.footer { font-size:.83rem; color:var(--muted); line-height:1.55; margin:19px 0 0; }
    @media(max-width:900px) { header { padding-top:72px; } h1 { margin-right:0; }.language-switcher { top:20px; right:20px; }.grid { grid-template-columns:1fr; } #status { margin-left:0; width:100%; } }@media(max-width:450px) { .language-switcher button { padding:8px 7px; font-size:.75rem; } }
  </style>
</head>
<body>
<header>
  <div class="language-switcher" role="group" aria-label="Language selector">
    <button type="button" data-lang="en" class="active">English</button><button type="button" data-lang="zh-Hant">繁體中文</button><button type="button" data-lang="zh-Hans">简体中文</button>
  </div>
  <h1 id="pageTitle"></h1><p id="pageSubtitle"></p>
</header>
<main>
  <section class="controls"><label id="metricLabel"><span></span><select id="metric"></select></label><label id="periodLabel"><span></span><select id="periods"></select></label><button id="refresh"></button><span id="status"></span></section>
  <div class="error" id="error"></div>
  <section class="kpis" id="kpis"></section>
  <section class="grid"><article class="card"><h2 id="trendTitle"></h2><p class="sub" id="trendSub"></p><div class="chart"><canvas id="trendChart"></canvas></div></article><article class="card"><h2 id="profileTitle"></h2><p class="sub" id="profileSub"></p><div class="chart"><canvas id="profileChart"></canvas></div></article></section>
  <section class="card" style="margin-top:18px"><h2 id="tableTitle"></h2><p class="sub" id="tableSub"></p><div class="table-wrap"><table id="dataTable"></table></div></section>
  <p class="footer" id="footer"></p>
</main>
<script>
const API='https://api.hkma.gov.hk/public/market-data-and-statistics/monthly-statistical-bulletin/banking/assetquality-ais';
const TEXT={
 en:{lang:'en',title:'HKMA Asset Quality Monitor',subtitle:'Quarterly asset-quality monitoring for Hong Kong authorized institutions, using HKMA’s official public API. All series are expressed as percentages of total loans.',metric:'Trend view',period:'Historical period',refresh:'Refresh HKMA API data',loading:'Loading HKMA API data…',latest:'Latest',records:'quarterly records',trendSub:'Quarterly observations · percentage of total loans',profileTitle:'Latest asset-quality profile',profileSub:'Headline stress and impairment indicators',tableTitle:'Quarterly observations',tableSub:'Official HKMA source fields. Scroll horizontally to view all measures.',quarter:'Quarter',noPrior:'No prior-quarter comparison',vsPrior:'vs prior quarter',loadFailed:'Data load failed',noRecords:'The HKMA API returned no records.',apiError:'Unable to retrieve HKMA asset-quality data.',cors:'If this occurs after deployment, check the browser network panel and CORS policy for the HKMA endpoint.',footer:'Source: Hong Kong Monetary Authority (HKMA), Monthly Statistical Bulletin — Banking — Asset quality: Authorized institutions. API endpoint: <code>assetquality-ais</code>. The API’s <code>end_of_month</code> field is displayed as a reporting quarter. This dashboard is for monitoring only and is not investment advice.',periods:['12 quarters','20 quarters','32 quarters','All available']},
 'zh-Hant':{lang:'zh-Hant',title:'金管局資產質素監察儀表板',subtitle:'使用香港金融管理局官方公開 API，按季監察香港認可機構的資產質素。所有比率均以貸款總額百分比表示。',metric:'趨勢指標',period:'歷史期間',refresh:'更新金管局 API 數據',loading:'正在載入金管局 API 數據…',latest:'最新期數',records:'個季度記錄',trendSub:'季度觀察值 · 佔貸款總額百分比',profileTitle:'最新資產質素概況',profileSub:'主要壓力及信貸減值指標',tableTitle:'季度觀察值',tableSub:'金管局官方來源欄位。請橫向捲動以查看所有指標。',quarter:'季度',noPrior:'未有上一季度可供比較',vsPrior:'較上一季度',loadFailed:'數據載入失敗',noRecords:'金管局 API 未有返回任何記錄。',apiError:'未能提取金管局資產質素數據。',cors:'如部署後出現此問題，請檢查瀏覽器網絡面板及金管局端點的 CORS 政策。',footer:'資料來源：香港金融管理局（金管局）《月度統計資料》— 銀行業 — 認可機構資產質素。API 端點：<code>assetquality-ais</code>。API 的 <code>end_of_month</code> 欄位於本儀表板中顯示為報告季度。本儀表板僅供監察用途，並不構成投資建議。',periods:['12 個季度','20 個季度','32 個季度','所有可用記錄']},
 'zh-Hans':{lang:'zh-Hans',title:'金管局资产质量监测仪表板',subtitle:'使用香港金融管理局官方公开 API，按季监测香港认可机构的资产质量。所有比率均以贷款总额百分比表示。',metric:'趋势指标',period:'历史期间',refresh:'更新金管局 API 数据',loading:'正在加载金管局 API 数据…',latest:'最新期数',records:'个季度记录',trendSub:'季度观察值 · 占贷款总额百分比',profileTitle:'最新资产质量概况',profileSub:'主要压力及信贷减值指标',tableTitle:'季度观察值',tableSub:'金管局官方来源字段。请横向滚动以查看所有指标。',quarter:'季度',noPrior:'没有上一季度可供比较',vsPrior:'较上一季度',loadFailed:'数据加载失败',noRecords:'金管局 API 未返回任何记录。',apiError:'未能提取金管局资产质量数据。',cors:'如部署后出现此问题，请检查浏览器网络面板及金管局端点的 CORS 策略。',footer:'资料来源：香港金融管理局（金管局）《月度统计资料》— 银行业 — 认可机构资产质量。API 端点：<code>assetquality-ais</code>。API 的 <code>end_of_month</code> 字段在本仪表板中显示为报告季度。本仪表板仅供监测用途，并不构成投资建议。',periods:['12 个季度','20 个季度','32 个季度','所有可用记录']}
};
const METRICS={
 pass_loans:{color:'#1565c0',good:'up',en:'Pass loans',hant:'正常貸款',hans:'正常贷款'},sp_ment_loans:{color:'#ef8d22',good:'down',en:'Special mention loans',hant:'特別關注貸款',hans:'特别关注贷款'},cl_gross_substandard:{color:'#d9414f',good:'down',en:'Substandard loans',hant:'次級貸款',hans:'次级贷款'},cl_gross_doubtful:{color:'#8e44ad',good:'down',en:'Doubtful loans',hant:'呆滯貸款',hans:'呆滞贷款'},cl_gross_loss:{color:'#667085',good:'down',en:'Loss loans',hant:'虧損貸款',hans:'亏损贷款'},cl_gross_total:{color:'#b91c1c',good:'down',en:'Gross classified-loan ratio',hant:'總分類貸款比率',hans:'总分类贷款比率'},cl_net:{color:'#2457d6',good:'down',en:'Net classified-loan ratio',hant:'淨分類貸款比率',hans:'净分类贷款比率'},loans_od3m:{color:'#e65100',good:'down',en:'Loans overdue >3 months',hant:'逾期超過三個月貸款',hans:'逾期超过三个月贷款'},loans_resch:{color:'#00897b',good:'down',en:'Rescheduled loans',hant:'重組貸款',hans:'重组贷款'},loans_od3m_resch_total:{color:'#5b21b6',good:'down',en:'Overdue >3 months + rescheduled loans',hant:'逾期超過三個月及重組貸款',hans:'逾期超过三个月及重组贷款'},cl_gross_mainland_lend:{color:'#6d28d9',good:'down',en:'Classified Mainland-related lending',hant:'分類中國內地相關貸款',hans:'分类中国内地相关贷款'}
};
let language=localStorage.getItem('hkma_asset_quality_language')||'en',allRows=[],trendChart,profileChart;
const $=s=>document.querySelector(s),t=k=>TEXT[language][k];
function metricLabel(k){const m=METRICS[k];return language==='en'?m.en:(language==='zh-Hant'?m.hant:m.hans)}
function number(v){if(v===null||v===undefined||v===''||v==='-'||v==='...')return null;const x=Number(String(v).replace(/[,%]/g,''));return Number.isFinite(x)?x:null}
function percentage(v){const x=number(v);return x===null?'—':x.toFixed(2)+'%'}
function quarter(v){const m=String(v||'').match(/(20\d{2})[-/]?(0[1-9]|1[0-2])?/);return m?`${m[1]} Q${Math.ceil(Number(m[2]||12)/3)}`:String(v||'—')}
function sortableDate(v){const m=String(v||'').match(/(20\d{2})[-/]?(0[1-9]|1[0-2])?/);return m?Number(m[1])*12+Number(m[2]||12):0}
function change(current,previous,direction){const c=number(current),p=number(previous);if(c===null||p===null)return{text:t('noPrior'),className:''};const delta=c-p,positive=direction==='up'?delta>=0:delta<=0;return{text:`${delta>=0?'▲':'▼'} ${Math.abs(delta).toFixed(2)} pp ${t('vsPrior')}`,className:delta===0?'':(positive?'good':'bad')}}
function records(p){return[p?.result?.records,p?.result?.data,p?.records,p?.data].find(Array.isArray)||[]}
async function getData(){let list=[],offset=0;for(let i=0;i<100;i++){const response=await fetch(`${API}?offset=${offset}`);if(!response.ok)throw new Error(`HKMA API request failed with status ${response.status}.`);const payload=await response.json(),batch=records(payload);list.push(...batch);const total=Number(payload?.result?.total??payload?.result?.total_records??NaN);if(!batch.length||batch.length<100||(Number.isFinite(total)&&list.length>=total))break;offset+=batch.length}const unique=new Map();list.forEach(r=>{const date=r.end_of_month||r.end_of_quarter||r.period;if(date)unique.set(date,{...r,report_date:date})});return[...unique.values()].sort((a,b)=>sortableDate(a.report_date)-sortableDate(b.report_date))}
function drawKpis(latest,prior){const keys=['cl_gross_total','cl_net','sp_ment_loans','loans_od3m','loans_resch','loans_od3m_resch_total','cl_gross_mainland_lend'];$('#kpis').innerHTML=keys.filter(k=>latest[k]!==undefined).map(k=>{const c=change(latest[k],prior?.[k],METRICS[k].good);return`<article class="card kpi"><div class="name">${metricLabel(k)}</div><div class="value">${percentage(latest[k])}</div><div class="change ${c.className}">${c.text}</div></article>`}).join('')}
function drawTrend(data,key){const m=METRICS[key];$('#trendTitle').textContent=metricLabel(key);$('#trendSub').textContent=t('trendSub');if(trendChart)trendChart.destroy();trendChart=new Chart($('#trendChart'),{type:'line',data:{labels:data.map(r=>quarter(r.report_date)),datasets:[{label:metricLabel(key),data:data.map(r=>number(r[key])),borderColor:m.color,backgroundColor:m.color+'22',fill:true,tension:.25,pointRadius:2,pointHoverRadius:5,spanGaps:true}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${metricLabel(key)}: ${percentage(c.raw)}`}}},scales:{x:{grid:{display:false}},y:{ticks:{callback:v=>v+'%'}}}}})}
function drawProfile(latest){const keys=['cl_gross_total','sp_ment_loans','cl_gross_substandard','cl_gross_doubtful','cl_gross_loss','loans_od3m','loans_resch','cl_gross_mainland_lend'].filter(k=>latest[k]!==undefined&&number(latest[k])!==null);if(profileChart)profileChart.destroy();profileChart=new Chart($('#profileChart'),{type:'bar',data:{labels:keys.map(metricLabel),datasets:[{data:keys.map(k=>number(latest[k])),backgroundColor:keys.map(k=>METRICS[k].color),borderRadius:4}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>percentage(c.raw)}}},scales:{x:{ticks:{callback:v=>v+'%'}},y:{grid:{display:false}}}}})}
function drawTable(data){const cols=['pass_loans','sp_ment_loans','cl_gross_total','cl_net','cl_gross_substandard','cl_gross_doubtful','cl_gross_loss','loans_od3m','loans_resch','loans_od3m_resch_total','cl_gross_mainland_lend'].filter(k=>allRows.some(r=>r[k]!==undefined));$('#dataTable').innerHTML=`<thead><tr><th>${t('quarter')}</th>${cols.map(k=>`<th>${metricLabel(k)}</th>`).join('')}</tr></thead><tbody>${[...data].reverse().map(r=>`<tr><td>${quarter(r.report_date)}</td>${cols.map(k=>`<td>${percentage(r[k])}</td>`).join('')}</tr>`).join('')}</tbody>`}
function render(){if(!allRows.length)return;const limit=Number($('#periods').value),data=limit>=allRows.length?allRows:allRows.slice(-limit),latest=allRows.at(-1),prior=allRows.at(-2);drawKpis(latest,prior);drawTrend(data,$('#metric').value);drawProfile(latest);drawTable(data);$('#status').textContent=`${t('latest')}: ${quarter(latest.report_date)} · ${allRows.length} ${t('records')}`}
function setLanguage(){document.documentElement.lang=t('lang');document.title=t('title');$('#pageTitle').textContent=t('title');$('#pageSubtitle').textContent=t('subtitle');$('#metricLabel span').textContent=t('metric');$('#periodLabel span').textContent=t('period');$('#refresh').textContent=t('refresh');$('#profileTitle').textContent=t('profileTitle');$('#profileSub').textContent=t('profileSub');$('#tableTitle').textContent=t('tableTitle');$('#tableSub').textContent=t('tableSub');$('#footer').innerHTML=t('footer');const metric=$('#metric').value||'cl_gross_total',period=$('#periods').value||'20';$('#metric').innerHTML=Object.keys(METRICS).map(k=>`<option value="${k}">${metricLabel(k)}</option>`).join('');$('#metric').value=metric;$('#periods').innerHTML=['12','20','32','999'].map((v,i)=>`<option value="${v}">${t('periods')[i]}</option>`).join('');$('#periods').value=period;document.querySelectorAll('.language-switcher button').forEach(b=>{b.classList.toggle('active',b.dataset.lang===language);b.setAttribute('aria-pressed',String(b.dataset.lang===language))});if(allRows.length)render();else $('#status').textContent=t('loading')}
async function refresh(){$('#error').style.display='none';$('#status').textContent=t('loading');$('#refresh').disabled=true;try{allRows=await getData();if(!allRows.length)throw new Error(t('noRecords'));render()}catch(err){console.error(err);$('#status').textContent=t('loadFailed');$('#error').textContent=`${t('apiError')} ${err.message} ${t('cors')}`;$('#error').style.display='block'}finally{$('#refresh').disabled=false}}
document.querySelectorAll('.language-switcher button').forEach(b=>b.addEventListener('click',()=>{language=b.dataset.lang;localStorage.setItem('hkma_asset_quality_language',language);setLanguage()}));$('#metric').addEventListener('change',render);$('#periods').addEventListener('change',render);$('#refresh').addEventListener('click',refresh);setLanguage();refresh();
</script>
</body>
</html>
